version: "3.9"

services:
  server:
    build: ./server
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        REACT_APP_SIGNALING_SERVER: ${REACT_APP_SIGNALING_SERVER:-http://localhost:5001}
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped